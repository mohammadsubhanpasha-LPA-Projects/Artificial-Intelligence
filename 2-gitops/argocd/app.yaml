apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arthur-excalibur
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/myorg/arthur-excalibur.git
    targetRevision: main
    path: 4-k8s/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
