groups:
- name: gawain-green-knight-alerts
  rules:
  - alert: HighFailoverEvents
    expr: rate(failover_events_total[5m]) > 10
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "High number of failover events detected"
  - alert: RTOTimeExceeded
    expr: rto_duration_milliseconds > 5
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: "RTO time is currently over 5ms"
